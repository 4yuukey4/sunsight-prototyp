<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SunSight</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='7' fill='%23f6b73c'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css">
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <script type="importmap">
  { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
  } }
  </script>
</head>
<body>
  <aside id="sidebar">
    <header class="brand">
      <div class="sun-dot"></div>
      <div>
        <h1>SunSight</h1>
        <p class="sub">Sun &amp; view exposure, cell by cell</p>
      </div>
    </header>

    <section>
      <label for="regionSelect">Region</label>
      <select id="regionSelect"></select>
      <div id="loadStatus" class="status"></div>
      <div id="regionSummary" class="summary"></div>
    </section>

    <section>
      <label for="metricSelect">Colour by</label>
      <select id="metricSelect"></select>
      <p id="metricHelp" class="help"></p>
      <label>Detail</label>
      <div class="seg" id="detailSeg">
        <button data-detail="cells" class="on">Cells (pixel matrix)</button>
        <button data-detail="buildings">Whole buildings</button>
      </div>
      <div id="legend"></div>
      <p class="help">Click any facade or roof cell for its numbers.</p>
    </section>

    <section>
      <h2>Climate <span id="climateYears" class="muted"></span></h2>
      <canvas id="climateChart" height="150"></canvas>
      <div id="climateStats" class="kv"></div>
    </section>
  </aside>

  <main id="map"></main>
  <div id="buildingPanel" class="panel hidden"></div>

  <div id="inspector" class="hidden">
    <div class="insp-head">
      <div>
        <h2 id="inspTitle">Building</h2>
        <p id="inspSub" class="muted"></p>
      </div>
      <button id="inspClose" class="ghost" title="Close (Esc)">✕</button>
    </div>
    <div id="inspStage"><div id="inspHint" class="hint">Drag to orbit · scroll to zoom · click a cell for details</div></div>
    <div class="insp-bar">
      <div class="seg" role="tablist">
        <button data-mode="annual" class="on">Annual metric</button>
        <button data-mode="instant">Sun at a moment</button>
      </div>
      <select id="inspMetric"></select>
      <div class="time-ctl">
        <input type="date" id="inspDate">
        <button id="inspPlay" class="ghost" title="Play the day">▶</button>
        <input type="range" id="inspTime" min="0" max="1440" step="5" value="720">
        <span id="inspTimeLabel" class="mono">12:00</span>
      </div>
      <label class="chk"><input type="checkbox" id="inspRays" checked> Sight-lines</label>
      <span id="inspSun" class="muted mono"></span>
      <button id="inspBack" class="hidden">← Back to orbit</button>
    </div>
    <div id="inspLegend"></div>
    <div id="cellInfo" class="panel hidden"></div>
  </div>

  <script type="module" src="/static/js/controllers/app.js"></script>
</body>
</html>
